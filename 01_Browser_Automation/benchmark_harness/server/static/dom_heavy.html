<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Benchmark: Heavy DOM (10k Nodes)</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; }
    .section-block { margin-bottom: 10px; border: 1px solid #e2e8f0; padding: 8px; border-radius: 4px; }
    .node-item { font-size: 11px; margin: 2px 0; color: #475569; }
    .highlight-target { background: #fef08a; padding: 6px; font-weight: bold; border: 2px solid #eab308; }
  </style>
</head>
<body>
  <h1>DOM Stress Test: 10,000 Elements</h1>
  <div id="generation-status">Generating 10,000 nodes...</div>
  <div id="benchmark-root"></div>

  <script>
    const startTime = performance.now();
    const root = document.getElementById('benchmark-root');
    const TOTAL_NODES = 10000;
    const TARGET_INDEX = 8742;

    const fragment = document.createDocumentFragment();
    let currentBlock = document.createElement('div');
    currentBlock.className = 'section-block';

    for (let i = 1; i <= TOTAL_NODES; i++) {
      const div = document.createElement('div');
      div.className = 'node-item';
      div.id = `node-${i}`;
      div.setAttribute('data-index', i);

      if (i === TARGET_INDEX) {
        div.className += ' highlight-target';
        div.id = 'needle-target';
        div.innerHTML = `<span>NEEDLE TARGET (ID: needle-target, index: ${i})</span> <button id="needle-btn" onclick="this.textContent='FOUND!'">Find Me</button>`;
      } else {
        div.textContent = `Node Item #${i} - synthetic DOM payload content text for tree traversal and AXTree sizing`;
      }

      currentBlock.appendChild(div);

      // Group every 100 nodes into a section block
      if (i % 100 === 0) {
        fragment.appendChild(currentBlock);
        currentBlock = document.createElement('div');
        currentBlock.className = 'section-block';
      }
    }
    if (currentBlock.hasChildNodes()) {
      fragment.appendChild(currentBlock);
    }
    root.appendChild(fragment);

    const endTime = performance.now();
    const statusDiv = document.getElementById('generation-status');
    statusDiv.textContent = `Ready: ${TOTAL_NODES} DOM nodes generated in ${(endTime - startTime).toFixed(1)}ms. Needle ID: #needle-target`;
    window.__total_nodes = document.querySelectorAll('.node-item').length;
    window.__fixture_ready = true;
  </script>
</body>
</html>
