<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Benchmark: Heavy DOM (10k Nodes)</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; }
    .node-item { padding: 2px 4px; font-size: 11px; margin: 1px; border-left: 2px solid #94a3b8; }
    .nested-container { margin-left: 8px; }
    .highlight-target { background: #fef08a; padding: 4px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>DOM Stress Test: 10,000 Elements</h1>
  <div id="generation-status">Generating 10,000 nodes...</div>
  <div id="benchmark-root"></div>

  <script>
    const startTime = performance.now();
    const root = document.getElementById('benchmark-root');
    const TOTAL_NODES = 10000;
    const TARGET_INDEX = 8742; // Deep needle in the haystack

    let fragment = document.createDocumentFragment();
    let currentParent = fragment;

    for (let i = 1; i <= TOTAL_NODES; i++) {
      const div = document.createElement('div');
      div.className = 'node-item';
      div.id = `node-${i}`;
      div.setAttribute('data-index', i);

      if (i === TARGET_INDEX) {
        div.className += ' highlight-target';
        div.id = 'needle-target';
        div.innerHTML = `<span>NEEDLE TARGET (ID: needle-target, index: ${i})</span><button id="needle-btn" onclick="this.textContent='FOUND!'">Find Me</button>`;
      } else {
        div.textContent = `Node Item #${i} - metric dummy text for payload sizing`;
      }

      // Every 50 nodes, create a nested hierarchy
      if (i % 50 === 0) {
        const nestedContainer = document.createElement('div');
        nestedContainer.className = 'nested-container';
        nestedContainer.appendChild(div);
        currentParent.appendChild(nestedContainer);
        if (i % 500 === 0) {
          fragment.appendChild(currentParent);
          currentParent = document.createElement('div');
        } else {
          currentParent = nestedContainer;
        }
      } else {
        currentParent.appendChild(div);
      }
    }
    fragment.appendChild(currentParent);
    root.appendChild(fragment);

    const endTime = performance.now();
    const statusDiv = document.getElementById('generation-status');
    statusDiv.textContent = `Ready: ${TOTAL_NODES} DOM nodes generated in ${(endTime - startTime).toFixed(1)}ms. Needle ID: #needle-target`;
    window.__fixture_ready = true;
    window.__total_nodes = TOTAL_NODES;
  </script>
</body>
</html>
