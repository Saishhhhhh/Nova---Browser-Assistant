<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Benchmark: Shadow DOM & IFrames</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; max-width: 800px; margin: auto; }
    .card { border: 1px solid #cbd5e1; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
    iframe { width: 100%; height: 180px; border: 1px dashed #94a3b8; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Cross-Boundary Benchmark: Shadow DOM & IFrames</h1>

  <div class="card">
    <h3>1. Open Shadow DOM Component</h3>
    <div id="shadow-host"></div>
  </div>

  <div class="card">
    <h3>2. Nested Iframe Target</h3>
    <iframe id="test-iframe" srcdoc="
      <!DOCTYPE html>
      <html>
      <head><style>body { font-family: sans-serif; padding: 10px; }</style></head>
      <body>
        <h4>Inside Nested Iframe</h4>
        <input id='iframe-input' placeholder='Type inside iframe...'>
        <button id='iframe-btn' onclick='this.textContent=&quot;IFRAME CLICKED!&quot;'>Click Inside Iframe</button>
      </body>
      </html>
    "></iframe>
  </div>

  <script>
    // Create Shadow DOM
    const host = document.getElementById('shadow-host');
    const shadowRoot = host.attachShadow({ mode: 'open' });
    shadowRoot.innerHTML = `
      <style>
        .shadow-box { padding: 12px; background: #ede9fe; border: 1px solid #8b5cf6; border-radius: 6px; }
        button { padding: 8px 14px; background: #7c3aed; color: white; border: none; border-radius: 4px; cursor: pointer; }
      </style>
      <div class="shadow-box">
        <p>This content lives inside <code>#shadow-root (open)</code>.</p>
        <button id="shadow-btn">Click Inside Shadow Root</button>
        <span id="shadow-status" style="margin-left: 10px; font-weight: bold;"></span>
      </div>
    `;
    const shadowBtn = shadowRoot.getElementById('shadow-btn');
    const shadowStatus = shadowRoot.getElementById('shadow-status');
    shadowBtn.addEventListener('click', () => {
      shadowBtn.textContent = 'SHADOW CLICKED!';
      shadowStatus.textContent = 'SUCCESS';
      shadowStatus.style.color = '#16a34a';
    });

    window.__fixture_ready = true;
  </script>
</body>
</html>
