<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Express Checkout</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0f19; color: #f1f5f9; padding: 32px; }
        .checkout-box { max-width: 640px; margin: 0 auto; background: #1e293b; padding: 28px; border-radius: 12px; border: 1px solid #334155; }
        h2 { margin-top: 0; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 12px; }
        .form-row { margin-bottom: 16px; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #cbd5e1; }
        input[type="text"], input[type="email"], select {
            width: 100%; padding: 10px 14px; border-radius: 6px; border: 1px solid #475569;
            background: #0f172a; color: #f8fafc; font-size: 15px; box-sizing: border-box;
        }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 16px; }
        .radio-group { display: flex; gap: 20px; margin-top: 8px; }
        .radio-label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .submit-btn {
            width: 100%; padding: 14px; background: #10b981; color: white; font-size: 16px;
            font-weight: 700; border: none; border-radius: 8px; cursor: pointer; margin-top: 24px;
        }
        .promo-group { display: flex; gap: 8px; }
        .apply-btn { padding: 10px 18px; background: #334155; color: white; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="checkout-box">
        <h2>Shipping & Payment Details</h2>

        <div class="form-row grid-2">
            <div>
                <label for="first-name">First Name</label>
                <input type="text" id="first-name" placeholder="Saish" />
            </div>
            <div>
                <label for="last-name">Last Name</label>
                <input type="text" id="last-name" placeholder="Karm" />
            </div>
        </div>

        <div class="form-row">
            <label for="email-address">Email Address for Confirmation</label>
            <input type="email" id="email-address" placeholder="saish@example.com" />
        </div>

        <div class="form-row">
            <label for="street-address">Street Address</label>
            <input type="text" id="street-address" placeholder="123 Tech Boulevard, Suite 400" />
        </div>

        <div class="form-row grid-3">
            <div>
                <label for="city-input">City</label>
                <input type="text" id="city-input" placeholder="San Francisco" />
            </div>
            <div>
                <label for="state-select">State</label>
                <select id="state-select">
                    <option value="CA">California</option>
                    <option value="NY">New York</option>
                    <option value="TX">Texas</option>
                    <option value="WA">Washington</option>
                </select>
            </div>
            <div>
                <label for="zip-code">Postal / Zip</label>
                <input type="text" id="zip-code" placeholder="94103" />
            </div>
        </div>

        <div class="form-row">
            <label>Delivery Speed</label>
            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" name="shipping-speed" value="standard" checked /> Standard (3-5 days) - Free
                </label>
                <label class="radio-label">
                    <input type="radio" name="shipping-speed" value="express" /> Express Priority (Next Day) - $14.99
                </label>
            </div>
        </div>

        <div class="form-row" style="margin-top: 20px;">
            <label for="promo-code">Promo or Gift Code</label>
            <div class="promo-group">
                <input type="text" id="promo-code" placeholder="SAVE20" />
                <button id="apply-promo-btn" class="apply-btn">Apply</button>
            </div>
        </div>

        <button id="place-order-btn" class="submit-btn">Place Order ($199.00)</button>
    </div>

</body>
</html>
